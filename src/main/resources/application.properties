spring.application.name=SecurityAuthJwtSystem


# ===============================
# APPLICATION
# ===============================

spring.application.name=security-system

server.port=8080


# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/security_system
spring.datasource.username=root
spring.datasource.password=root9099

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=mySecretKeymySecretKeymySecretKeymySecretKey

jwt.access-token-expiration=3600000

jwt.refresh-token-expiration=604800000


# ===============================
# SWAGGER / OPENAPI
# ===============================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method

springdoc.swagger-ui.tagsSorter=alpha


# ===============================
# SECURITY LOGGING
# ===============================

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG


# ===============================
# JACKSON
# ===============================

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB


# ===============================
# SERVER SECURITY HEADERS
# ===============================

server.forward-headers-strategy=framework


# ===============================
# CONNECTION POOL (HIKARI)
# ===============================

spring.datasource.hikari.maximum-pool-size=20

spring.datasource.hikari.minimum-idle=5

spring.datasource.hikari.idle-timeout=30000

spring.datasource.hikari.max-lifetime=1800000

spring.datasource.hikari.connection-timeout=30000


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always


# =========================
# OAuth2 Authorization Server
# =========================

spring.security.oauth2.authorizationserver.client.my-client.registration.client-id=my-client

spring.security.oauth2.authorizationserver.client.my-client.registration.client-secret={noop}secret

spring.security.oauth2.authorizationserver.client.my-client.registration.authorization-grant-types=client_credentials,password,refresh_token

spring.security.oauth2.authorizationserver.client.my-client.registration.client-authentication-methods=client_secret_basic

spring.security.oauth2.authorizationserver.client.my-client.registration.scopes=read,write


# ===============================
# GATEWAY CONFIGURATION
# ===============================

spring.cloud.gateway.routes[0].id=auth-service

spring.cloud.gateway.routes[0].uri=http://localhost:8080

spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**


spring.cloud.gateway.routes[1].id=user-service

spring.cloud.gateway.routes[1].uri=http://localhost:8081

spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**


# ===============================
# MULTI-TENANT HEADER
# ===============================

security.tenant.header=X-Tenant-ID
..................
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
